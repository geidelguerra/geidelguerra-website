version: "3"

# Load variables (e.g. SERVER, DOMAIN for `task deploy`) from a local .env
# file, if present. Silent, so it's a no-op when the file doesn't exist.
dotenv: [".env"]

vars:
  BIN_DIR: bin
  BIN_NAME: website
  DIST_DIR: dist

tasks:
  default:
    desc: List available tasks
    cmd: task --list-all

  deps:
    desc: Download and tidy Go module dependencies
    cmds:
      - go mod download
      - go mod tidy

  templ:generate:
    desc: Generate Go code from .templ files
    sources:
      - internal/**/*.templ
    generates:
      - internal/**/*_templ.go
    cmd: templ generate

  templ:watch:
    desc: Watch .templ files and regenerate on change
    cmd: templ generate --watch

  fmt:
    desc: Format Go and templ source files
    cmds:
      - templ fmt .
      - go fmt ./...

  build:
    desc: Build the website binary (single statically-linked executable)
    deps:
      - templ:generate
    env:
      CGO_ENABLED: 0
    cmd: go build -ldflags="-s -w" -o {{.BIN_DIR}}/{{.BIN_NAME}} .

  build:linux:
    desc: Cross-compile a statically-linked binary for linux/amd64 (used for deployment)
    deps:
      - templ:generate
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: 0
    cmd: go build -ldflags="-s -w" -o {{.BIN_DIR}}/{{.BIN_NAME}} .

  run:
    desc: Run the live server (go run, no build artifact; configured via HOST/PORT env vars or .env)
    deps:
      - templ:generate
    cmd: go run .

  dev:
    desc: Run the live server and watch .templ files for changes in parallel
    deps:
      - templ:watch
      - run

  generate:
    desc: Export a static build of the site into dist/
    deps:
      - templ:generate
    cmd: go run . generate -out {{.DIST_DIR}} {{.CLI_ARGS}}

  serve:static:
    desc: Serve the generated static build locally (for previewing dist/)
    dir: "{{.DIST_DIR}}"
    cmd: python3 -m http.server 8080

  test:
    desc: Run Go tests
    cmd: go test ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}} {{.DIST_DIR}}

  "deploy:ssh":
    desc: 'Build for linux/amd64 and deploy via SSH, incl. nginx (requires SERVER=user@host and DOMAIN=example.com)'
    deps:
      - build:linux
    requires:
      vars:
        - SERVER
        - DOMAIN
    cmd: ./deploy_ssh.sh

  "deploy:cloudflare":
    desc: 'Deploy as a Cloudflare Container via deploy_cloudflare.sh (requires DOMAIN=example.com, already an active Cloudflare zone)'
    requires:
      vars:
        - DOMAIN
    cmd: ./deploy_cloudflare.sh

